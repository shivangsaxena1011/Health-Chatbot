    <path d="M 80 270 L 170 270 L 210 180 L 270 340 L 310 250 L 350 270 L 432 270" stroke="#ffffff" stroke-width="26" />
    <!-- Glowing Accent Wave -->
    <path d="M 80 270 L 170 270 L 210 180 L 270 340 L 310 250 L 350 270 L 432 270" stroke="#a7f3d0" stroke-width="12" />
  </g>
  
  <!-- Sparkle badge -->
