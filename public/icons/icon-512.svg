<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad512)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255,255,255,0.15)" stroke-width="8" fill="none" />
  
  <!-- Main Medical Cross & Heartbeat Wave -->
  <g filter="url(#shadow512)" fill="none" stroke-linecap="round" stroke-linejoin="round">
